name: Build Wow x64 (clean)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -A x64 -DWOWDECOMP_DISABLE_SIGNATURE_CHECKS=ON
        shell: pwsh

      - name: Build WowClient (main client)
        run: cmake --build build --config Release --target WowClient --parallel
        shell: pwsh

      - name: List build tree
        run: Get-ChildItem -Path build -Recurse -Include *.exe,*.dll | Select-Object FullName, Length
        shell: pwsh

      - name: Collect binaries
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Get-ChildItem -Path build -Recurse -Filter *.exe | Copy-Item -Destination out -Force
          Get-ChildItem -Path build -Recurse -Filter *.dll | Copy-Item -Destination out -Force
          Get-ChildItem out | Select-Object Name, Length
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wow-x64-clean
          path: out/*
          retention-days: 7
