name: Build Wow x64 (clean)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -A x64 -DWOWDECOMP_DISABLE_SIGNATURE_CHECKS=ON
        shell: pwsh

      - name: Build Wow (no console)
        run: cmake --build build --config Release --target Wow --parallel
        shell: pwsh

      - name: Collect binaries
        run: |
          $dst = Join-Path $env:RUNNER_TEMP "out"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter *.exe |
            Where-Object { $_.Length -gt 1MB } |
            Copy-Item -Destination $dst -Force
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter *.map |
            Where-Object { $_.Length -gt 100KB } |
            Copy-Item -Destination $dst -Force
          Get-ChildItem $dst | Select-Object Name, Length
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wow-x64-clean
          path: ${{ runner.temp }}/out/*
          retention-days: 7
